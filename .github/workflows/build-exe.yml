# Builds the operator's Windows exe on GitHub's Windows machines, so nobody
# needs Python installed to get a working better-meos.exe.
#
# Every push: download the installer (better-meos-installer) or the bare exe
# from the run's "Artifacts" section (Actions tab).
# Release: bump version.py + CHANGELOG.md, then either push a tag like v1.2.0,
# or run this workflow by hand (Actions > Build Windows exe > Run workflow)
# with "release" ticked, which tags the commit itself. Either way the
# installer and exe are attached to a GitHub Release with the changelog notes,
# a plain download link to hand to operators.
name: Build Windows exe

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release: tags this commit v<version.py> and attaches the installer"
        type: boolean
        default: false

permissions:
  contents: write   # attach the exe to a release on tag pushes

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Direct slip printing works (prints to Microsoft Print to PDF)
        run: python installer/print_check.py
      - name: Disk benchmark (journal modes; experiment branch only)
        if: github.ref_name == 'claude/project-review-roadmap-gi2jih'
        run: python scripts/stress/diskbench.py 1500
      - name: Stress suite (whole events against real app processes)
        run: python scripts/stress/run.py

  build:
    # Independent of the test job: a failing test shows up red on the run,
    # but the exe still builds so it can be tried.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: pyinstaller --noconfirm better-meos.spec
      - name: Check the exe starts and serves the start page
        shell: pwsh
        run: |
          $env:BMEOS_PORT = "18799"; $env:BMEOS_PUBLIC_PORT = "18800"
          New-Item -ItemType Directory -Force smoke | Out-Null
          Copy-Item dist\better-meos.exe smoke\
          $p = Start-Process -FilePath smoke\better-meos.exe -WorkingDirectory smoke -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30 -and -not $ok; $i++) {
            Start-Sleep -Seconds 2
            try { $ok = (Invoke-WebRequest http://127.0.0.1:18799/start -UseBasicParsing).StatusCode -eq 200 } catch {}
          }
          # Direct printing needs pywin32 inside the exe: the printer list proves it's there.
          $printers = $null
          if ($ok) { $printers = Invoke-RestMethod http://127.0.0.1:18799/api/printers }
          Stop-Process -Id $p.Id -Force
          if (-not $ok) { throw "exe did not serve /start" }
          if (-not $printers.available) { throw "exe can't print directly (pywin32 missing?)" }
          Write-Host "printers seen by the exe: $($printers.printers -join ', ')"
      - name: Tag matches version.py (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $code = python -c "from version import __version__; print(__version__)"
          if ("${{ github.ref_name }}".TrimStart("v") -ne $code) { throw "tag ${{ github.ref_name }} doesn't match version.py ($code): bump version.py first" }
      - name: Version and release notes
        id: ver
        shell: pwsh
        run: |
          $v = python -c "from version import __version__; print(__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT
          # This version's CHANGELOG.md section becomes the release notes.
          $lines = Get-Content CHANGELOG.md
          $start = [array]::IndexOf($lines, ($lines | Where-Object { $_ -like "## $v *" } | Select-Object -First 1))
          $notes = @()
          if ($start -ge 0) {
            for ($i = $start + 1; $i -lt $lines.Count -and $lines[$i] -notlike "## *"; $i++) { $notes += $lines[$i] }
          }
          ($notes -join "`n").Trim() | Set-Content release-notes.md
      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $version = python -c "from version import __version__; print(__version__)"
          if ("${{ github.ref }}" -notlike "refs/tags/v*") { $version = "$version.${{ github.run_number }}" }
          & $iscc "/DAppVersion=$version" installer\better-meos.iss
          if ($LASTEXITCODE -ne 0) { throw "installer build failed" }
      - name: Check the installer installs and the app starts
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist\better-meos-setup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "installer exited with $($p.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA "Programs\better-meos\better-meos.exe"
          if (-not (Test-Path $exe)) { throw "better-meos.exe not installed at $exe" }
          $env:BMEOS_PORT = "18799"; $env:BMEOS_PUBLIC_PORT = "18800"
          $app = Start-Process -FilePath $exe -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30 -and -not $ok; $i++) {
            Start-Sleep -Seconds 2
            try { $ok = (Invoke-WebRequest http://127.0.0.1:18799/start -UseBasicParsing).StatusCode -eq 200 } catch {}
          }
          Stop-Process -Id $app.Id -Force
          if (-not $ok) { throw "installed app did not serve /start" }
          if (-not (Test-Path (Join-Path $env:USERPROFILE "better-meos\config.json"))) { throw "settings were not written to the user's better-meos folder" }
      - uses: actions/upload-artifact@v4
        with:
          name: better-meos-exe
          path: dist/better-meos.exe
      - uses: actions/upload-artifact@v4
        with:
          name: better-meos-installer
          path: dist/better-meos-setup.exe
      - name: Publish the release (v* tag pushed, or run by hand with "release" ticked)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: better-meos ${{ steps.ver.outputs.version }}
          body_path: release-notes.md
          files: |
            dist/better-meos-setup.exe
            dist/better-meos.exe
