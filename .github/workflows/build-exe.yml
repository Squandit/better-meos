# Builds the operator's Windows exe on GitHub's Windows machines, so nobody
# needs Python installed to get a working control-orienteering.exe (Control).
#
# Every push: download the installer (control-orienteering-installer) or the bare exe
# from the run's "Artifacts" section (Actions tab).
# Release: bump version.py + CHANGELOG.md, then either push a tag like v1.2.0,
# or run this workflow by hand (Actions > Build Windows exe > Run workflow)
# with "release" ticked, which tags the commit itself. Either way the
# installer and exe are attached to a GitHub Release with the changelog notes,
# a plain download link to hand to operators.
name: Build Windows exe

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release: tags this commit v<version.py> and attaches the installer"
        type: boolean
        default: false

permissions:
  contents: write   # attach the exe to a release on tag pushes

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Direct slip printing works (prints to Microsoft Print to PDF)
        run: python installer/print_check.py
      - name: Stress suite (whole events against real app processes)
        run: python scripts/stress/run.py
        # A whole run takes about ten minutes; a hang should fail, not sit for hours.
        timeout-minutes: 30

  build:
    # Independent of the test job: a failing test shows up red on the run,
    # but the exe still builds so it can be tried.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: pyinstaller --noconfirm control-orienteering.spec
      - name: Check the exe starts and serves the start page
        shell: pwsh
        run: |
          $env:BMEOS_PORT = "18799"; $env:BMEOS_PUBLIC_PORT = "18800"
          New-Item -ItemType Directory -Force smoke | Out-Null
          Copy-Item dist\control-orienteering.exe smoke\
          $p = Start-Process -FilePath smoke\control-orienteering.exe -WorkingDirectory smoke -PassThru
          $ok = $false
          for ($i = 0; $i -lt 30 -and -not $ok; $i++) {
            Start-Sleep -Seconds 2
            try { $ok = (Invoke-WebRequest http://127.0.0.1:18799/start -UseBasicParsing).StatusCode -eq 200 } catch {}
          }
          # Direct printing needs pywin32 inside the exe: the printer list proves it's there.
          $printers = $null
          if ($ok) { $printers = Invoke-RestMethod http://127.0.0.1:18799/api/printers }
          # By name: the one-file exe runs as two processes, and stopping only
          # the outer one leaves the app running (holding its folder and ports).
          Get-Process control-orienteering -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          if (-not $ok) { throw "exe did not serve /start" }
          if (-not $printers.available) { throw "exe can't print directly (pywin32 missing?)" }
          Write-Host "printers seen by the exe: $($printers.printers -join ', ')"
      - name: Tag matches version.py (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $code = python -c "from version import __version__; print(__version__)"
          if ("${{ github.ref_name }}".TrimStart("v") -ne $code) { throw "tag ${{ github.ref_name }} doesn't match version.py ($code): bump version.py first" }
      - name: Version and release notes
        id: ver
        shell: pwsh
        run: |
          $v = python -c "from version import __version__; print(__version__)"
          "version=$v" >> $env:GITHUB_OUTPUT
          # This version's CHANGELOG.md section becomes the release notes.
          $lines = Get-Content CHANGELOG.md
          $start = [array]::IndexOf($lines, ($lines | Where-Object { $_ -like "## $v *" } | Select-Object -First 1))
          $notes = @()
          if ($start -ge 0) {
            for ($i = $start + 1; $i -lt $lines.Count -and $lines[$i] -notlike "## *"; $i++) { $notes += $lines[$i] }
          }
          ($notes -join "`n").Trim() | Set-Content release-notes.md
      - name: Build the installer
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          $version = python -c "from version import __version__; print(__version__)"
          if ("${{ github.ref }}" -notlike "refs/tags/v*") { $version = "$version.${{ github.run_number }}" }
          & $iscc "/DAppVersion=$version" installer\control-orienteering.iss
          if ($LASTEXITCODE -ne 0) { throw "installer build failed" }
      - name: Check the installer upgrades a better-meos install and the app starts
        shell: pwsh
        run: |
          # An operator on 1.2.0 (still called better-meos), with an event. The
          # smoke test above made a control-orienteering folder; a real operator
          # upgrading wouldn't have one.
          Remove-Item -Recurse -Force (Join-Path $env:USERPROFILE "control-orienteering") -ErrorAction SilentlyContinue
          Invoke-WebRequest https://github.com/Squandit/better-meos/releases/download/v1.2.0/better-meos-setup.exe -OutFile old-setup.exe
          $p = Start-Process -FilePath old-setup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "old installer exited with $($p.ExitCode)" }
          $oldData = Join-Path $env:USERPROFILE "better-meos"
          Set-Content (Join-Path $oldData "events\club-champs.bmeos") "not really sqlite"
          $p = Start-Process -FilePath dist\control-orienteering-setup.exe -ArgumentList "/VERYSILENT", "/SUPPRESSMSGBOXES", "/NORESTART" -PassThru -Wait
          if ($p.ExitCode -ne 0) { throw "installer exited with $($p.ExitCode)" }
          $exe = Join-Path $env:LOCALAPPDATA "Programs\control-orienteering\control-orienteering.exe"
          if (-not (Test-Path $exe)) { throw "control-orienteering.exe not installed at $exe" }
          if (Test-Path (Join-Path $env:LOCALAPPDATA "Programs\better-meos")) { throw "the old better-meos program folder is still there" }
          # Ports of its own, so nothing left over from the smoke test can answer.
          $env:BMEOS_PORT = "18801"; $env:BMEOS_PUBLIC_PORT = "18802"
          $app = Start-Process -FilePath $exe -PassThru -RedirectStandardOutput app-out.txt -RedirectStandardError app-err.txt
          $ok = $false
          for ($i = 0; $i -lt 30 -and -not $ok -and -not $app.HasExited; $i++) {
            Start-Sleep -Seconds 2
            try { $ok = (Invoke-WebRequest http://127.0.0.1:18801/start -UseBasicParsing).StatusCode -eq 200 } catch {}
          }
          Get-Process control-orienteering -ErrorAction SilentlyContinue | Stop-Process -Force
          Start-Sleep -Seconds 2
          Write-Host "--- app output ---"; Get-Content app-out.txt, app-err.txt -ErrorAction SilentlyContinue
          if (-not $ok) { throw "installed app did not serve /start" }
          $data = Join-Path $env:USERPROFILE "control-orienteering"
          if (-not (Test-Path (Join-Path $data "config.json"))) { throw "settings were not written to the user's control-orienteering folder" }
          # Moved with the folder, and renamed .ctrl when the start page listed it.
          if (-not (Test-Path (Join-Path $data "events\club-champs.ctrl"))) { throw "the old better-meos event didn't move into control-orienteering as club-champs.ctrl" }
          if (Test-Path $oldData) { throw "the old better-meos data folder is still there" }
      - uses: actions/upload-artifact@v4
        with:
          name: control-orienteering-exe
          path: dist/control-orienteering.exe
      - uses: actions/upload-artifact@v4
        with:
          name: control-orienteering-installer
          path: dist/control-orienteering-setup.exe
      - name: Publish the release (v* tag pushed, or run by hand with "release" ticked)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Control ${{ steps.ver.outputs.version }}
          body_path: release-notes.md
          files: |
            dist/control-orienteering-setup.exe
            dist/control-orienteering.exe
